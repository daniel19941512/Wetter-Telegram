name: Wetterkarten an Telegram senden

on:
  schedule:
    # UTC-Zeiten! Aktuell 05:00 / 18:00 UTC
    # = 07:00 / 20:00 Uhr Sommerzeit (CEST, UTC+2) <- so aktuell eingestellt
    # = 06:00 / 19:00 Uhr Winterzeit (CET,  UTC+1) - im Winter ggf. auf "0 6,19 * * *" anpassen,
    #   falls es dann wieder 07:00/20:00 Uhr lokal sein soll
    - cron: "0 5,18 * * *"
  workflow_dispatch: {}   # erlaubt manuelles Auslösen zum Testen ("Run workflow" Button)

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install requests

      - name: Wetterkarten senden
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python send_weather.py
